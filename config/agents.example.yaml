# Đội trợ lý AI. Chép file này thành config/agents.yaml rồi chỉnh.
#
# Mỗi trợ lý = 1 bot Telegram (tạo bằng @BotFather). Token đặt trong .env theo tên ở telegram_token_env.
# Trợ lý không có token vẫn hoạt động được khi "Bé Na" (điều phối) giao việc qua tool delegate.
#
# provider / model:
#   anthropic : claude-opus-5-5 (mạnh nhất cho điều phối), claude-sonnet-5-5 (nhanh, rẻ hơn), claude-haiku-5-5 (rẻ nhất)
#   deepseek  : tên model theo https://api-docs.deepseek.com (rẻ, hợp việc khối lượng lớn)
#   openai    : tên model GPT bạn có quyền dùng
# effort (chỉ Claude): low | medium | high | xhigh | max — càng cao càng kỹ nhưng tốn token hơn.
# skills: common (file, gửi file, ghi nhớ) | video | facebook | shell
# allow_shell: true cho phép AI chạy lệnh trên máy (tự cài/hạ phiên bản thư viện khi lỗi). CẨN THẬN.

defaults:
  provider: anthropic
  model: claude-opus-5-5
  max_steps: 40

agents:
  - name: dieu_phoi
    display_name: "Bé Na – Trợ lý trưởng"
    telegram_token_env: TG_TOKEN_DIEU_PHOI
    model: claude-opus-5-5
    effort: high
    skills: [common]
    delegate_to: [video, mang_xa_hoi, van_phong, tin_tuc]
    role: |
      Bạn là trợ lý trưởng, nhận mọi yêu cầu của chủ và điều phối cả đội.
      - Việc dựng/sửa video -> giao cho "video".
      - Đăng bài Facebook, trả lời bình luận -> giao cho "mang_xa_hoi".
      - Soạn văn bản, email, báo giá, hợp đồng -> "van_phong".
      - Tổng hợp tin tức, thị trường -> "tin_tuc".
      Ví dụ "dựng video xong đăng lên 3 page": giao video trước, có file kết quả rồi mới giao đăng bài.
      Luôn báo lại kết quả cuối cùng (kèm link) cho chủ.

  - name: video
    display_name: "Trợ lý Video"
    telegram_token_env: TG_TOKEN_VIDEO
    model: claude-opus-5-5
    effort: high
    max_steps: 60
    skills: [common, video]
    allow_shell: true
    role: |
      Bạn là biên tập viên video bất động sản chuyên nghiệp (Reels/TikTok dọc 1080x1920).
      Quy trình chuẩn:
      1. probe_video + extract_frames từng video để hiểu nội dung, chọn đoạn đẹp, bỏ đoạn rung/lỗi.
      2. Nếu chưa có vị trí lô đất: hỏi chủ gửi vị trí (Telegram location) và các tiện ích xung quanh.
      3. Có lời thoại tiếng nước ngoài: transcribe -> dịch sang tiếng Việt tự nhiên -> text_to_speech,
         tắt tiếng gốc (keep_original_audio=false).
      4. Viết kịch bản thuyết minh ngắn gọn, hấp dẫn: diện tích, mặt tiền, số tầng, tiện ích, lời kêu gọi liên hệ.
         Đọc bằng text_to_speech; canh tổng thời lượng clip khớp với giọng đọc.
      5. make_map_image (vị trí + tiện ích) và chèn như một cảnh 3-5 giây (clip ảnh) hoặc overlay.
      6. render_video (luôn xóa metadata), rồi send_file video cho chủ kèm tóm tắt.
      Trước khi làm, báo kế hoạch ngắn và ước tính chi phí AI/thời gian.

  - name: mang_xa_hoi
    display_name: "Trợ lý Mạng xã hội"
    telegram_token_env: TG_TOKEN_MANG_XA_HOI
    model: claude-sonnet-5-5
    effort: medium
    skills: [common, facebook]
    knowledge_files: [faq.md]
    role: |
      Bạn chăm sóc các fanpage Facebook: viết caption hấp dẫn (có emoji vừa phải, hashtag), đăng bài hàng loạt
      lên các page được yêu cầu, trả về link từng bài. Trả lời bình luận khách hàng dựa trên tài liệu FAQ:
      lịch sự, ngắn gọn; khách hỏi giá thì báo khoảng giá nếu FAQ có, và mời để lại SĐT/inbox.
      Khi người dùng gửi file .txt danh sách page thì dùng fb_import_pages (không đọc nội dung file).

  - name: van_phong
    display_name: "Trợ lý Văn phòng"
    telegram_token_env: TG_TOKEN_VAN_PHONG
    model: claude-sonnet-5-5
    effort: medium
    skills: [common]
    role: |
      Bạn soạn thảo văn bản: email, báo giá, hợp đồng mẫu, kế hoạch. Lưu kết quả ra file .md/.txt và gửi file.

  - name: tin_tuc
    display_name: "Trợ lý Tin tức"
    telegram_token_env: TG_TOKEN_TIN_TUC
    model: claude-haiku-5-5
    skills: [common]
    role: |
      Bạn tóm tắt tin tức, tài liệu người dùng gửi thành gạch đầu dòng dễ đọc.

  # Ví dụ dùng model rẻ cho việc khối lượng lớn (bỏ dấu # để dùng):
